<svg width="680" height="360" viewBox="0 0 680 360" role="img" xmlns="http://www.w3.org/2000/svg">
<title>NetProbe producer-consumer threading model</title>
<desc>The capture thread produces packets into a bounded PacketQueue guarded by a mutex and condition variable; on overflow the oldest packet is dropped and counted. The UI thread consumes packets each frame to parse and render.</desc>
<style>
text{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif}
.t{font-size:14px;fill:#14212e}
.ts{font-size:12px;fill:#5B6472}
.th{font-size:14px;font-weight:500;fill:#14212e}
.hd{font-size:16px;font-weight:600;fill:#14212e}
.arr{stroke:#7A8593;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7A8593" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="360" rx="12" fill="#ffffff" stroke="#E4E7EC"/>

<text class="hd" x="24" y="30">NetProbe — producer / consumer threading</text>

<!-- thread divider -->
<line x1="340" y1="52" x2="340" y2="344" stroke="#D9DEE4" stroke-width="1.5" stroke-dasharray="6 5"/>
<text class="ts" x="150" y="66" text-anchor="middle">capture thread (producer)</text>
<text class="ts" x="516" y="66" text-anchor="middle">UI thread (consumer)</text>

<!-- producer side -->
<g><rect x="40" y="82" width="150" height="46" rx="7" fill="#E0F2F1" stroke="#2A9187"/><text class="th" x="115" y="101" text-anchor="middle">Backend</text><text class="ts" x="115" y="117" text-anchor="middle">Npcap / libpcap</text></g>
<g><rect x="40" y="150" width="150" height="46" rx="7" fill="#E6F1FB" stroke="#2A6FB0"/><text class="th" x="115" y="169" text-anchor="middle">CaptureEngine</text><text class="ts" x="115" y="185" text-anchor="middle">captureLoop()</text></g>
<line class="arr" x1="115" y1="128" x2="115" y2="148" marker-end="url(#arrow)"/>
<text class="ts" x="122" y="142">nextPacket()</text>

<!-- queue in center -->
<rect x="250" y="96" width="180" height="150" rx="10" fill="#F6F7F9" stroke="#98A2B0"/>
<text class="th" x="340" y="116" text-anchor="middle">PacketQueue</text>
<text class="ts" x="340" y="132" text-anchor="middle">mutex + condition_variable</text>
<rect x="268" y="146" width="144" height="20" rx="4" fill="#E6F1FB" stroke="#2A6FB0"/>
<rect x="268" y="170" width="144" height="20" rx="4" fill="#E6F1FB" stroke="#2A6FB0"/>
<rect x="268" y="194" width="144" height="20" rx="4" fill="#E6F1FB" stroke="#2A6FB0"/>
<text class="ts" x="340" y="234" text-anchor="middle">fixed capacity · FIFO</text>

<line class="arr" x1="190" y1="173" x2="248" y2="173" marker-end="url(#arrow)"/>
<text class="ts" x="219" y="166" text-anchor="middle">push</text>

<!-- drop-oldest callout -->
<g><rect x="250" y="266" width="180" height="46" rx="7" fill="#FCE8E6" stroke="#E1705B"/><text class="th" x="340" y="285" text-anchor="middle">overflow → drop oldest</text><text class="ts" x="340" y="301" text-anchor="middle">increment dropped count</text></g>
<line class="arr" x1="340" y1="246" x2="340" y2="264" marker-end="url(#arrow)"/>

<!-- consumer side -->
<g><rect x="490" y="82" width="150" height="46" rx="7" fill="#EDE7F6" stroke="#7E57C2"/><text class="th" x="565" y="101" text-anchor="middle">GuiLayer</text><text class="ts" x="565" y="117" text-anchor="middle">ImGui frame loop</text></g>
<g><rect x="490" y="150" width="150" height="46" rx="7" fill="#E4F4E4" stroke="#4CAF50"/><text class="th" x="565" y="169" text-anchor="middle">Parser + views</text><text class="ts" x="565" y="185" text-anchor="middle">≤1000 / frame</text></g>
<line class="arr" x1="565" y1="128" x2="565" y2="148" marker-end="url(#arrow)"/>
<line class="arr" x1="432" y1="173" x2="488" y2="173" marker-end="url(#arrow)"/>
<text class="ts" x="460" y="166" text-anchor="middle">try_pop</text>

<text class="ts" x="340" y="336" text-anchor="middle">dropped count is surfaced in the control bar</text>
</svg>
