<svg width="680" height="356" viewBox="0 0 680 356" role="img" xmlns="http://www.w3.org/2000/svg">
<title>NetProbe technology stack</title>
<desc>The C++20 core sits at the center, surrounded by dependency groups: capture backends, UI and plotting, decode crypto and GeoIP, file dialogs, and build and test tooling, all pinned through CMake FetchContent.</desc>
<style>
text{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif}
.t{font-size:14px;fill:#14212e}
.ts{font-size:12px;fill:#5B6472}
.th{font-size:14px;font-weight:500;fill:#14212e}
.hd{font-size:16px;font-weight:600;fill:#14212e}
.arr{stroke:#7A8593;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7A8593" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="356" rx="12" fill="#ffffff" stroke="#E4E7EC"/>

<text class="hd" x="24" y="30">NetProbe — technology stack</text>

<g><rect x="270" y="150" width="140" height="56" rx="9" fill="#EEF0F2" stroke="#98A2B0"/><text class="th" x="340" y="174" text-anchor="middle">NetProbe</text><text class="ts" x="340" y="190" text-anchor="middle">C++20 core</text></g>

<text class="ts" x="40" y="62">capture</text>
<g><rect x="40" y="70" width="190" height="40" rx="7" fill="#E6F1FB" stroke="#2A6FB0"/><text class="t" x="135" y="95" text-anchor="middle">Npcap SDK · libpcap</text></g>

<text class="ts" x="450" y="62">interface</text>
<g><rect x="450" y="70" width="190" height="40" rx="7" fill="#EDE7F6" stroke="#7E57C2"/><text class="t" x="545" y="89" text-anchor="middle">Dear ImGui · GLFW</text><text class="ts" x="545" y="103" text-anchor="middle">docking · ImPlot charts</text></g>

<text class="ts" x="40" y="152">decode</text>
<g><rect x="40" y="158" width="190" height="40" rx="7" fill="#E4F4E4" stroke="#4CAF50"/><text class="t" x="135" y="177" text-anchor="middle">Mbed TLS</text><text class="ts" x="135" y="191" text-anchor="middle">HKDF · AES-GCM (QUIC)</text></g>

<text class="ts" x="450" y="152">enrich</text>
<g><rect x="450" y="158" width="190" height="40" rx="7" fill="#E0F2F1" stroke="#2A9187"/><text class="t" x="545" y="177" text-anchor="middle">libmaxminddb</text><text class="ts" x="545" y="191" text-anchor="middle">GeoIP · ASN</text></g>

<text class="ts" x="40" y="242">dialogs</text>
<g><rect x="40" y="248" width="190" height="40" rx="7" fill="#FCF0DA" stroke="#C98A1B"/><text class="t" x="135" y="273" text-anchor="middle">Native File Dialog</text></g>

<text class="ts" x="450" y="242">quality</text>
<g><rect x="450" y="248" width="190" height="40" rx="7" fill="#FCE8E6" stroke="#E1705B"/><text class="t" x="545" y="267" text-anchor="middle">GoogleTest · libFuzzer</text><text class="ts" x="545" y="281" text-anchor="middle">60 tests + fuzz harness</text></g>

<g><rect x="255" y="300" width="170" height="40" rx="7" fill="#EEF0F2" stroke="#98A2B0"/><text class="t" x="340" y="319" text-anchor="middle">CMake · FetchContent</text><text class="ts" x="340" y="333" text-anchor="middle">all deps pinned</text></g>

