<svg width="680" height="470" viewBox="0 0 680 470" role="img" xmlns="http://www.w3.org/2000/svg">
<title>NetProbe live capture control flow</title>
<desc>Sequence diagram: the user starts capture, GuiLayer tells CaptureEngine to open a device, apply a BPF filter and spawn a capture thread; the backend delivers packets into the queue while the UI frame loop drains, parses and renders them.</desc>
<style>
text{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif}
.t{font-size:13px;fill:#14212e}
.ts{font-size:11.5px;fill:#5B6472}
.th{font-size:13px;font-weight:500;fill:#14212e}
.hd{font-size:16px;font-weight:600;fill:#14212e}
.life{stroke:#C6CCD4;stroke-width:1.5}
.msg{stroke:#7A8593;stroke-width:1.5;fill:none}
.ret{stroke:#7A8593;stroke-width:1.3;fill:none;stroke-dasharray:5 4}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#7A8593" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="680" height="470" rx="12" fill="#ffffff" stroke="#E4E7EC"/>

<text class="hd" x="24" y="30">NetProbe — live capture control flow</text>

<!-- actor columns: x centers 70,190,310,430,540,630 -->
<g>
<rect x="30" y="46" width="80" height="34" rx="7" fill="#EDE7F6" stroke="#7E57C2"/><text class="th" x="70" y="68" text-anchor="middle">User</text>
<rect x="140" y="46" width="100" height="34" rx="7" fill="#E6F1FB" stroke="#2A6FB0"/><text class="th" x="190" y="68" text-anchor="middle">GuiLayer</text>
<rect x="262" y="46" width="100" height="34" rx="7" fill="#E6F1FB" stroke="#2A6FB0"/><text class="th" x="312" y="68" text-anchor="middle">CaptureEngine</text>
<rect x="384" y="46" width="100" height="34" rx="7" fill="#E0F2F1" stroke="#2A9187"/><text class="th" x="434" y="68" text-anchor="middle">Backend</text>
<rect x="500" y="46" width="86" height="34" rx="7" fill="#E0F2F1" stroke="#2A9187"/><text class="th" x="543" y="68" text-anchor="middle">Queue</text>
<rect x="596" y="46" width="60" height="34" rx="7" fill="#E4F4E4" stroke="#4CAF50"/><text class="ts" x="626" y="67" text-anchor="middle">Parser+Views</text>
</g>

<line class="life" x1="70" y1="80" x2="70" y2="440"/>
<line class="life" x1="190" y1="80" x2="190" y2="440"/>
<line class="life" x1="312" y1="80" x2="312" y2="440"/>
<line class="life" x1="434" y1="80" x2="434" y2="440"/>
<line class="life" x1="543" y1="80" x2="543" y2="440"/>
<line class="life" x1="626" y1="80" x2="626" y2="440"/>

<line class="msg" x1="70" y1="104" x2="190" y2="104" marker-end="url(#arrow)"/>
<text class="ts" x="76" y="98">select adapter / Start</text>
<line class="msg" x1="190" y1="132" x2="312" y2="132" marker-end="url(#arrow)"/>
<text class="ts" x="196" y="126">startCapture(device)</text>
<line class="msg" x1="312" y1="160" x2="434" y2="160" marker-end="url(#arrow)"/>
<text class="ts" x="318" y="154">open(device)</text>
<line class="msg" x1="312" y1="188" x2="434" y2="188" marker-end="url(#arrow)"/>
<text class="ts" x="318" y="182">apply BPF filter</text>
<line class="msg" x1="312" y1="216" x2="312" y2="216"/>
<path class="msg" d="M312 208 h34 v14 h-34" marker-end="url(#arrow)"/>
<text class="ts" x="352" y="220">spawn capture thread</text>

<!-- capture loop box -->
<rect x="286" y="238" width="290" height="82" rx="8" fill="none" stroke="#C98A1B" stroke-dasharray="4 4"/>
<text class="ts" x="294" y="252" fill="#7A4E06">loop  · backend packets (capture thread)</text>
<line class="msg" x1="434" y1="276" x2="312" y2="276" marker-end="url(#arrow)"/>
<text class="ts" x="330" y="270">nextPacket()</text>
<line class="msg" x1="312" y1="302" x2="543" y2="302" marker-end="url(#arrow)"/>
<text class="ts" x="330" y="296">retain in session buffer · push(PacketData)</text>

<!-- UI frame loop box -->
<rect x="150" y="336" width="500" height="86" rx="8" fill="none" stroke="#2A6FB0" stroke-dasharray="4 4"/>
<text class="ts" x="158" y="350" fill="#0C447C">loop  · each UI frame (main thread)</text>
<line class="msg" x1="190" y1="374" x2="543" y2="374" marker-end="url(#arrow)"/>
<text class="ts" x="200" y="368">try_pop up to 1000 packets</text>
<line class="msg" x1="190" y1="402" x2="626" y2="402" marker-end="url(#arrow)"/>
<text class="ts" x="200" y="396">parse · recover SNI/DNS · update history, flows, stats, charts</text>
</svg>
