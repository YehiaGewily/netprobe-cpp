name: Build and test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: windows-x64
            build_testing: OFF
          - name: Ubuntu x64
            os: ubuntu-latest
            artifact: ubuntu-x64
            build_testing: ON
          - name: macOS
            os: macos-latest
            artifact: macos
            build_testing: ON

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows Npcap SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest https://npcap.com/dist/npcap-sdk-1.13.zip -OutFile npcap-sdk.zip
          Expand-Archive npcap-sdk.zip -DestinationPath C:\Npcap-SDK

      - name: Install Ubuntu dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev libgl1-mesa-dev libgtk-3-dev pkg-config

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=${{ matrix.build_testing }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        if: matrix.build_testing == 'ON'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        run: cpack --config build/CPackConfig.cmake -C Release -G ZIP -B package

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: netprobe-${{ matrix.artifact }}
          path: package/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: netprobe-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/*.zip --generate-notes
